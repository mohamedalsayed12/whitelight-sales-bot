name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whitelight
          POSTGRES_PASSWORD: whitelight
          POSTGRES_DB: whitelight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelight -d whitelight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://whitelight:whitelight@localhost:5432/whitelight_test
      TEST_DATABASE_URL: postgresql+psycopg://whitelight:whitelight@localhost:5432/whitelight_test
      JWT_SECRET: ci-test-secret-must-be-32-bytes-min
      JWT_EXPIRE_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v
